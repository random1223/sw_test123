<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events | PNW Soundwave</title>
  <meta name="description" content="Recent events and community outreach by PNW Soundwave, a nonprofit supporting deaf and hard-of-hearing children through music.">
  <meta name="keywords" content="PNW Soundwave, events, nonprofit, deaf children, music outreach, violin performances">

  <link href="assets/img/favicon.png" rel="icon">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

  <header id="header" class="header d-flex align-items-center sticky-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">
      <a class="logo d-flex align-items-center me-auto" href="index.html">
        <h1>PNW Soundwave</h1>
      </a>
      <div id="navmenu-placeholder"></div>
    </div>
  </header>

  <main class="main">

    <div class="page-title" data-aos="fade">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-2">
            <h3>Events</h3>
          </div>
        </div>
      </div>
    </div>

    <section id="events" class="events section">
      <div class="container" data-aos="fade-up" id="events-container">
      </div>
    </section>

  </main>

  <footer id="footer" class="footer position-relative">
    <div class="container footer-top">
      <div class="row gy-4">
        <div class="col-lg-4 col-md-6 footer-about">
          <a href="index.html" class="logo d-flex align-items-center">
            <span>PNW Soundwave</span>
          </a>
        </div>
      </div>
    </div>
    <div class="container copyright text-center mt-4">
      <p>© <span>Copyright</span> <strong class="px-1">PNW Soundwave</strong> <span>All Rights Reserved</span></p>
    </div>
  </footer>

  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
  <div id="preloader"></div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/events-data.js"></script>

  <script>
    const PAGE_SIZE = 10;
    const container = document.getElementById('events-container');
    let filteredData = EVENTS_DATA;
    let currentPage = 1;

    // Build year filter buttons
    function buildFilters() {
      const years = ['All'].concat(
        [...new Set(EVENTS_DATA.map(e => e.date.match(/\d{4}/)?.[0]).filter(Boolean))].sort((a,b) => b-a)
      );
      const bar = document.createElement('div');
      bar.className = 'events-filter';
      years.forEach(y => {
        const btn = document.createElement('button');
        btn.textContent = y;
        if (y === 'All') btn.classList.add('active');
        btn.addEventListener('click', function() {
          bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          filteredData = y === 'All' ? EVENTS_DATA : EVENTS_DATA.filter(e => e.date.includes(y));
          currentPage = 1;
          updateUrl(1);
          renderPage(1);
        });
        bar.appendChild(btn);
      });
      container.parentElement.insertBefore(bar, container);
    }

    function goToPage(pageNum) {
      updateUrl(pageNum);
      currentPage = pageNum;
      renderPage(pageNum);
    }

    function updateUrl(pageNum) {
      const url = new URL(window.location);
      url.searchParams.set('page', pageNum);
      window.history.pushState({}, '', url);
    }

    function buildPagination(pageNum, totalPages, cls) {
      if (totalPages <= 1) return '';
      const pageItems = Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
        `<li class="page-item${p === pageNum ? ' active' : ''}">
          <a class="page-link" href="?page=${p}" onclick="goToPage(${p});return false;">${p}</a>
        </li>`).join('');
      return `
        <nav class="${cls}">
          <ul class="pagination justify-content-center">
            <li class="page-item${pageNum === 1 ? ' disabled' : ''}">
              <a class="page-link" href="?page=${pageNum - 1}" onclick="goToPage(${pageNum - 1});return false;">Previous</a>
            </li>
            ${pageItems}
            <li class="page-item${pageNum === totalPages ? ' disabled' : ''}">
              <a class="page-link" href="?page=${pageNum + 1}" onclick="goToPage(${pageNum + 1});return false;">Next</a>
            </li>
          </ul>
        </nav>`;
    }

    function renderPage(pageNum) {
      const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
      pageNum = Math.min(Math.max(pageNum, 1), totalPages || 1);
      const start = (pageNum - 1) * PAGE_SIZE;
      const items = filteredData.slice(start, start + PAGE_SIZE);

      const cards = items.length ? items.map(e => `
        <div class="event-row">
          <div class="event-img">
            ${e.img.map(src => `<img src="${src}" alt="${e.title} — ${e.date}">`).join('')}
          </div>
          <div class="event-body">
            <h5 class="card-title">${e.title}</h5>
            <p class="event-date">${e.date}</p>
            ${e.paragraphs.map(p => `<p class="card-text">${p}</p>`).join('')}
          </div>
        </div>`).join('') : '<p class="text-center py-5 text-muted">No events found.</p>';

      container.innerHTML = buildPagination(pageNum, totalPages, 'mb-4') + cards + buildPagination(pageNum, totalPages, 'mt-4');
      window.scrollTo(0, 0);
    }

    buildFilters();
    const initialPage = parseInt(new URLSearchParams(window.location.search).get('page')) || 1;
    renderPage(initialPage);
  </script>

</body>

</html>
