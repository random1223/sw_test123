  <script>
    const page = EVENTS_DATA.slice(25);
    const container = document.getElementById('events-container');
    container.innerHTML = page.map(e => `
      <div class="row">
        <div class="col-md-12 d-flex align-items-stretch">
          <div class="card">
            <div class="card-img">
              ${e.img.map(src => `<img src="${src}" alt="${e.title}">`).join('')}
            </div>
            <div class="card-body">
              <h5 class="card-title">${e.title}</h5>
              <p class="fst-italic text-center">${e.date}</p>
              ${e.paragraphs.map(p => `<p class="card-text">${p}</p>`).join('')}
            </div>
          </div>
        </div>
      </div>`).join('') +
      '<h3><a href="events.html">Go Back to First Page</a></h3>';
